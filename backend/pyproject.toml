[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-sakti-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.8,<3", "pymongo>=4.13,<5", "clerk-backend-api>=6,<7", "google-genai>=1.30,<2", "langgraph>=1,<2", "langsmith>=0.4,<1", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "pypdf>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
# Ragas 0.4.3 imports VertexAI shims removed in community 0.4.2.
evaluation = ["ragas==0.4.3", "langchain-community==0.4.1", "instructor[google-genai]>=1.11,<2"]

[tool.setuptools.packages.find]
include = ["app*", "ingestion*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
